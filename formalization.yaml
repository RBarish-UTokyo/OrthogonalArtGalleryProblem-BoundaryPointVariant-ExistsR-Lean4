fidelity:
  divergences: |-
    - Machine model, polynomial time and reductions are those of PALOMAR-2026-10-02-000013: deterministic single-tape Turing machines over {blank, 0, 1, separator}, time = number of steps, polynomial bounds c * (n + 1)^k, polynomial-time many-one (Karp) reductions. ∃ℝ is the class of languages that reduce to ETR; invariance under other machine models is not proved.
    - ETR formulas are quantifier-free formulas with constants 0, 1, operations +, −, · and relations =, <, ≤ under ¬, ∧, ∨, read existentially; variable indices are coded in unary. Art gallery instances are coded with numerators, denominators and g in binary.
    - Polygons are lists of corners; simple means at least three distinct corners and any two distinct edges meeting exactly in common endpoints (collinear consecutive corners allowed); orthogonal means every edge is horizontal or vertical. The region is the boundary plus the bounded components of its complement; seeing means the closed segment lies in the region.
    - AGPOrthBoundaryPoint asks for exactly g points of the boundary of an orthogonal simple polygon that together see every point of the closed region; this is equivalent to at most g, since the boundary is infinite and guards can be added. It is the restriction of the boundary-point variant of [AAM] to orthogonal polygons, with the definitions of PALOMAR-2026-11-01-000004.
    - The hardness construction (hub and wings) is our own (the forthcoming manuscript) and uses explicit coordinates designed for the formalization.

