  notes: >-
    The Challenge statement was checked against the definitions of the sources and of
    PALOMAR-2026-11-01-000004 during the AI-assisted development. The proof is checked by the Lean
    kernel, and Comparator verifies that the solution proves the challenge statement using only
    the permitted axioms (README.md, section Checking). No human mathematical review or Palomar
    editorial review is asserted.

